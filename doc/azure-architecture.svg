  <text x="116" y="456" class="section" fill="#71d9df">AZURE FUNCTIONS · .NET 6 / FUNCTIONS V4</text>
  <text x="116" y="487" class="card-title">levin-url-shortener</text>
  <text x="116" y="510" class="card-sub">Single Function App; hosting SKU and scale settings are not declared here.</text>

  <rect x="116" y="534" width="684" height="144" rx="11" fill="#142b40" stroke="#345570"/>
  <text x="136" y="561" class="tag" fill="#7ce9ed">HTTP FUNCTIONS</text>
  <text x="136" y="587" class="detail">UrlRedirect · anonymous GET/POST → look up code, enqueue analytics, return redirect</text>
  <text x="136" y="610" class="detail">ShortenUrl · function-key POST → create short code and save URL</text>
  <text x="136" y="633" class="detail">Utility / HomeRedirect · serve admin page / redirect home</text>
  <text x="136" y="656" class="detail">UpdateTwitter · function-key POST → reads Cosmos document; sets referralTweet in handler</text>

  <rect x="116" y="697" width="684" height="139" rx="11" fill="#142b40" stroke="#345570"/>
  <text x="136" y="724" class="tag" fill="#a9d0ff">BACKGROUND &amp; SCHEDULED FUNCTIONS</text>
  <text x="136" y="751" class="detail">ProcessQueue · consumes requests and writes analytics to Cosmos DB</text>
  <text x="136" y="774" class="detail">KeepAlive · timer trigger every 4 minutes</text>
  <text x="136" y="797" class="detail">TweetScheduler · function-key HTTP trigger; checks link and posted state</text>
  <text x="136" y="820" class="tiny">Tweet / Mastodon / Bluesky publishing routines are not currently invoked.</text>

