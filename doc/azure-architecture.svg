<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Azure deployment architecture for LevinUrlShortener</title>
  <desc id="desc">Repository-documented architecture for the levin-url-shortener Azure Functions app. Visitors and administrators use HTTP functions for redirects and link creation. Azure Table Storage stores short links, an Azure Storage queue buffers redirect analytics for processing into Cosmos DB, and Application Insights receives telemetry. GitHub Actions deploys the Function App. A Logic App timer is described in the README as calling the TweetScheduler function; the function's social-posting calls are currently disabled. Hosting plan, region, resource names, and custom-domain bindings are not defined in this repository.</desc>
